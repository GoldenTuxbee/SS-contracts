[package]
name = "portfolio-nav-snapshot"
version = "0.1.0"
edition = "2021"
publish = false
description = "Invoice portfolio snapshot contract for net asset value (NAV) tracking and computation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
