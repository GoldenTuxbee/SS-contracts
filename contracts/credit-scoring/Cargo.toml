[package]
name = "credit-scoring"
version = "0.1.0"
edition = "2021"
publish = false
description = "Credit scoring contract assigning issuers a risk tier based on financial history"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
