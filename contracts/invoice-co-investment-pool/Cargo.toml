[package]
name = "invoice-co-investment-pool"
version = "0.1.0"
edition = "2021"
publish = false
description = "Retail co-investment pools that aggregate small contributions into one invoice position"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
