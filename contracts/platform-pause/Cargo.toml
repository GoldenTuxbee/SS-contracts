[package]
name = "platform-pause"
version = "0.1.0"
edition = "2021"
# Deployed as WASM, never published to crates.io.
publish = false
description = "StellarSettle emergency pause contract with timelocked resumption"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
