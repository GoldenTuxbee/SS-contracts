[package]
name = "invoice-hardship-extension"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hardship grace period extensions that pause the penalty accrual of an invoice"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
